name: Build Windows DLL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  OBS_VERSION: "30.1.2"
  QT_VERSION: "6.5.3"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2019_64'

      - name: Checkout OBS Studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          path: obs-studio
          ref: ${{ env.OBS_VERSION }}
          submodules: recursive

      - name: Patch OBS Studio libobs-d3d11
        run: echo '#pragma comment(lib, "d3dcompiler.lib")' >> obs-studio/libobs-d3d11/d3d11-shader.cpp
        shell: bash

      - name: Download and Extract obs-deps
        run: |
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-deps/releases/download/2024-03-19/windows-deps-2024-03-19-x64.zip" -OutFile "obs-deps.zip"
          Expand-Archive -Path "obs-deps.zip" -DestinationPath "${{ github.workspace }}/prebuilt-obs-deps"
        shell: pwsh

      # FIXED: Changed -DENABLE_UI and -DENABLE_FRONTEND_API to ON so obs-frontend-api gets built and installed
      - name: Configure OBS Studio
        run: cmake -S obs-studio -B obs-studio/build -G "Visual Studio 17 2022" -A x64 -DENABLE_UI=ON -DENABLE_FRONTEND_API=ON -DENABLE_PLUGINS=OFF -DENABLE_SCRIPTING=OFF -DCMAKE_PREFIX_PATH="${{ github.workspace }}/prebuilt-obs-deps;${{ github.workspace }}/prebuilt-obs-deps/bin;${{ env.Qt6_DIR }}"
        shell: bash

      - name: Build OBS Studio Dependencies
        run: cmake --build obs-studio/build --config Release --parallel
        shell: bash

      - name: Install OBS Studio
        run: cmake --install obs-studio/build --config Release --prefix "${{ github.workspace }}/obs-deps"
        shell: bash

      - name: Configure Plugin
        run: cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64 -Dobs-frontend-api_DIR="${{ github.workspace }}/obs-studio/build/UI/obs-frontend-api" -DCMAKE_PREFIX_PATH="${{ github.workspace }}/obs-studio/build;${{ github.workspace }}/obs-studio/build/deps/w32-pthreads;${{ github.workspace }}/obs-deps;${{ github.workspace }}/prebuilt-obs-deps;${{ env.Qt6_DIR }}"
        shell: bash

      - name: Build Plugin
        run: |
          cmake --build plugin/build --config Release --parallel
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-dual-stream-windows
          path: plugin/build/Release/obs-dual-stream.dll
